name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP 8.1
    runs-on: ubuntu-latest

    defaults:
      run:
        # Tamar is checked out alongside Beacon and Sentinel, mirroring a
        # WordPress plugins/ directory, so run everything from inside Tamar.
        working-directory: tamar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: tamar

      - name: Checkout Beacon
        # Tamar is a Beacon driver and implements its contracts.
        # Scanned by phpstan.neon so cross-plugin symbols resolve.
        uses: actions/checkout@v4
        with:
          repository: bleedingdeacons/beacon
          ref: main
          path: beacon

      - name: Checkout Sentinel
        # Provides Sentinel_Log_Channel, referenced in type positions by HasLogger.
        # Scanned by phpstan.neon so cross-plugin symbols resolve.
        uses: actions/checkout@v4
        with:
          repository: bleedingdeacons/sentinel
          ref: main
          path: sentinel

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          # zip: build.php assembles the release archive with ZipArchive.
          extensions: mbstring, intl, json, zip
          tools: composer:v2
          # pcov drives PHPUnit's line coverage for the Coveralls upload
          # below. Much faster than xdebug for coverage-only runs.
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          # Keyed on composer.json: composer.lock is untracked in several of
          # these repos, so it is not a reliable cache key across the suite.
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.1-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php8.1-composer-

      # --- Gates -----------------------------------------------------------
      # These fail the build. Each is verified to pass in this repo today.

      - name: Validate composer.json
        # --no-check-lock: composer.lock is untracked in some repos and drifted
        # from composer.json in others. Lock state is reported as advisory
        # rather than blocking every PR in the suite.
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint PHP syntax
        # Shipped code only: tests/ is covered by the advisory test run, and
        # some suites currently contain files that cannot be parsed.
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              echo "$out"
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -path ./build -prune \
                        -o -path ./tests -prune -o -path ./node_modules -prune \
                        -o -name '*.php' -print0)
          exit $status

      - name: Build production archive
        # The build is what /bump ships, so a broken build must fail the PR.
        run: composer build:production

      - name: PHPStan
        # A gate, promoted from advisory now the repo is green. It ran
        # advisory for a long time, which hid that cross-plugin symbols were
        # unresolvable; the sibling checkouts above are what fixed that.
        run: composer phpstan

      - name: PHPUnit
        # A gate, promoted from advisory now the suite is green.
        run: composer test -- --coverage-clover build/logs/clover.xml

      # --- Advisory --------------------------------------------------------
      # Reported but not yet enforced. Promote to a gate once a repo is green.

      - name: PHPCS (advisory)
        run: composer cs
        continue-on-error: true

      - name: Upload coverage to Coveralls (advisory)
        # Reports a coverage number; does not gate the build. The Clover report
        # is produced by the PHPUnit step above. This action runs from the repo
        # root (defaults.run.working-directory does not apply to `uses:` steps),
        # so the file is under tamar/ and base-path strips that prefix back off
        # the paths inside the report to match the repository layout.
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: tamar/build/logs/clover.xml
          format: clover
          base-path: tamar
          # Private repo: Coveralls rejects GITHUB_TOKEN and needs a repo
          # token. Add it as the COVERALLS_REPO_TOKEN secret (from
          # coveralls.io). Advisory step, so it no-ops until the secret exists.
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: composer.lock up to date (advisory)
        run: composer validate
        continue-on-error: true
